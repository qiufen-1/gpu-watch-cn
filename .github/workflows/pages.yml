name: Daily GPU prices and Pages
on:
  push:
    branches: [main]
    paths-ignore: ['data.json']
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: read
concurrency:
  group: gpu-prices-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests.mjs
      - name: Collect authorized prices
        env:
          GPU_FEED_URL: ${{ secrets.GPU_FEED_URL }}
          GPU_FEED_TOKEN: ${{ secrets.GPU_FEED_TOKEN }}
        run: node collect.mjs
      - name: Preserve price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified GPU price history"
            git push
          fi
      - run: node collect.mjs --build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
